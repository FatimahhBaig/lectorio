<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Plans - Lectorio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="responsive.css">
</head>

<body class="bg-slate-50 text-slate-900">

<div class="min-h-screen flex app-shell">

    <!-- Sidebar -->
    <div id="sidebarContainer"></div>

    <!-- Main -->
    <main class="flex-1 app-main">

        <div class="page-pad">

            <!-- Header -->
            <div class="flex items-start justify-between gap-4 mb-8 mobile-stack">
                <div>
                    <h2 class="page-heading font-bold text-slate-900">
                        My Plans
                    </h2>

                    <p class="mt-2 text-slate-500">
                        Choose a subject plan to view your day-by-day study schedule.
                    </p>
                </div>

                <a href="new-plan.html"
                   class="inline-flex min-h-11 items-center justify-center bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-3 rounded-xl text-sm font-semibold">
                    ＋ New Plan
                </a>
            </div>

            <!-- Plans List -->
            <div id="plansListContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

                <!-- JS will load plan cards here -->

            </div>

        </div>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 px-4 py-6 mt-10 sm:px-6 lg:px-8">
            <div class="flex justify-between">
                <div>
                    <h3 class="text-lg font-bold text-slate-900">
                        Lectorio
                    </h3>

                    <p class="mt-1 text-sm text-slate-500">
                        © 2024 Lectorio. Engineered for deep focus.
                    </p>
                </div>
            </div>
        </footer>

    </main>

</div>

<script src="lectorio.js"></script>
<script src="auth.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
